name: Ruff Autofix

on:
  push:
    branches:
      - agent/temporal-technology-mapping

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Apply Ruff fixes
        run: |
          uv run ruff check --fix --exit-zero .
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "benchmarks/snake/analyze_mapping.py": [
                  (
                      '            print("  solve=not attempted; physical state-cell port timing is intentionally unresolved")',
                      '            print(\n'
                      '                "  solve=not attempted; physical state-cell port timing is "\n'
                      '                "intentionally unresolved"\n'
                      '            )',
                  ),
              ],
              "benchmarks/snake/generate_mapping.py": [
                  (
                      "Abstract Physical IR, and then handed to the established physical synthesis/layout/blueprint backend.",
                      "Abstract Physical IR, and then handed to the established physical synthesis/layout/blueprint\nbackend.",
                  ),
                  (
                      "sequence encoded by that model. Random Input selector/oracle technology mapping is a later milestone.",
                      "sequence encoded by that model. Random Input selector/oracle technology mapping is a later\nmilestone.",
                  ),
                  (
                      '    parser.add_argument("--period", type=int, default=60, help="logical period in ticks (default: 60)")',
                      '    parser.add_argument(\n'
                      '        "--period",\n'
                      '        type=int,\n'
                      '        default=60,\n'
                      '        help="logical period in ticks (default: 60)",\n'
                      '    )',
                  ),
              ],
              "src/factorio_circuit/mapping/clocked_state_solver.py": [
                  (
                      '            "ordinary clocked state cells require period >= 3 for the shared startup/commit resource"',
                      '            "ordinary clocked state cells require period >= 3 for the shared "\n'
                      '            "startup/commit resource"',
                  ),
              ],
              "src/factorio_circuit/mapping/extract.py": [
                  (
                      "    token throughout ``[k*period, (k+1)*period)``. It is useful for mapping a post-update output cone",
                      "    token throughout ``[k*period, (k+1)*period)``. It is useful for mapping a post-update\n    output cone",
                  ),
                  (
                      "    physical phase of a real register read port may depend on the selected state-cell implementation.",
                      "    physical phase of a real register read port may depend on the selected state-cell\n    implementation.",
                  ),
              ],
              "src/factorio_circuit/mapping/plan.py": [
                  (
                      "when its ports are used, which state-cell implementation realizes each periodic register, which exact",
                      "when its ports are used, which state-cell implementation realizes each periodic register,\nwhich exact",
                  ),
              ],
              "src/factorio_circuit/mapping/problem.py": [
                  (
                      '            raise MappingProblemError("mapping state transition requires a StateTransition semantic")',
                      '            raise MappingProblemError(\n'
                      '                "mapping state transition requires a StateTransition semantic"\n'
                      '            )',
                  ),
                  (
                      '            raise MappingProblemError("stateful mapping problems require a prescribed logical period")',
                      '            raise MappingProblemError(\n'
                      '                "stateful mapping problems require a prescribed logical period"\n'
                      '            )',
                  ),
              ],
              "src/factorio_circuit/mapping/state_lower.py": [
                  (
                      "Fixed semantic constant sources are reported separately because ``MappingProblem`` does not yet price\nthem. The ordinary arithmetic Select candidate also has an internal exact false-arm preservation path",
                      "Fixed semantic constant sources are reported separately because ``MappingProblem`` does not yet\nprice them. The ordinary arithmetic Select candidate also has an internal exact false-arm\npreservation path",
                  ),
                  (
                      '            raise MappingProblemError("first mapped periodic state lowering does not admit wire sums")',
                      '            raise MappingProblemError(\n'
                      '                "first mapped periodic state lowering does not admit wire sums"\n'
                      '            )',
                  ),
                  (
                      '                raise MappingProblemError("selected state-cell candidate belongs to another register")',
                      '                raise MappingProblemError(\n'
                      '                    "selected state-cell candidate belongs to another register"\n'
                      '                )',
                  ),
                  (
                      '            raise MappingProblemError("mapped Freeze lowerer requires the four-entity clocked candidate")',
                      '            raise MappingProblemError(\n'
                      '                "mapped Freeze lowerer requires the four-entity clocked candidate"\n'
                      '            )',
                  ),
                  (
                      '            raise MappingProblemError("mapped Freeze candidate does not describe one set transition")',
                      '            raise MappingProblemError(\n'
                      '                "mapped Freeze candidate does not describe one set transition"\n'
                      '            )',
                  ),
                  (
                      '            raise MappingProblemError("mapped Accumulator candidate requires add and clear transitions")',
                      '            raise MappingProblemError(\n'
                      '                "mapped Accumulator candidate requires add and clear transitions"\n'
                      '            )',
                  ),
              ],
              "src/factorio_circuit/mapping/state_lower_entry.py": [
                  (
                      '            raise AssertionError("periodic commit resource must exist before output materialization")',
                      '            raise AssertionError(\n'
                      '                "periodic commit resource must exist before output materialization"\n'
                      '            )',
                  ),
              ],
              "src/factorio_circuit/mapping/state_templates.py": [
                  (
                      "State timing is target technology. The neutral recurrence IR records register occurrences and semantic",
                      "State timing is target technology. The neutral recurrence IR records register occurrences and\nsemantic",
                  ),
                  (
                      "    Local entity cost is therefore four: add-active decider, retain decider, vector add gate, memory.",
                      "    Local entity cost is therefore four: add-active decider, retain decider, vector add gate,\n    memory.",
                  ),
                  (
                      '            f"ordinary Accumulator state cell {register_name!r} requires exactly one add and one clear"',
                      '            f"ordinary Accumulator state cell {register_name!r} requires exactly one add "\n'
                      '            "and one clear"',
                  ),
                  (
                      "        item.semantic.register for item in problem.state_reads if item.register_name == register_name",
                      "        item.semantic.register\n        for item in problem.state_reads\n        if item.register_name == register_name",
                  ),
              ],
              "tests/mapping/test_delay_bus_parity.py": [
                  (
                      "    charges one isolated egress per semantic use. Until joint egress coalescing is modeled explicitly,",
                      "    charges one isolated egress per semantic use. Until joint egress coalescing is modeled\n    explicitly,",
                  ),
              ],
          }

          for path_text, edits in replacements.items():
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format .
          uv run ruff check .
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Ruff cleanup"
          git push origin HEAD:agent/temporal-technology-mapping
