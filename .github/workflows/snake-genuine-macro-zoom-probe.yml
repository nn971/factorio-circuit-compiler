name: Snake genuine macro zoom probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Measure genuine coarse macro zoom
        run: |
          mkdir -p /tmp/macro-zoom
          uv run python -m benchmarks.snake.multilevel_zoom_probe | tee /tmp/macro-zoom/report.json
      - name: Preserve report
        uses: actions/upload-artifact@v4
        with:
          name: snake-genuine-macro-zoom-probe
          path: /tmp/macro-zoom/report.json
