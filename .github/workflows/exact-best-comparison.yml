name: Exact best comparison

on:
  push:
    branches:
      - agent/annealing-v2-exact-best-tracking

jobs:
  compare:
    if: "${{ github.event.head_commit.message == 'ci: probe layout hash determinism' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Probe clustered layout across Python hash seeds
        run: |
          for hash_seed in 1 2 3 4 5 42; do
            echo "PYTHONHASHSEED=$hash_seed"
            PYTHONHASHSEED=$hash_seed uv run python -c 'from benchmarks.layout_optimizer_topology_corpus import _clustered_sparse_cut_case; from factorio_circuit.synthesis.layout_optimizer import optimize_physical_layout; from factorio_circuit.synthesis.placement import PlacementOptions; case=_clustered_sparse_cut_case(); result=optimize_physical_layout(case.problem, options=PlacementOptions(anchor_io=False, reserve_corridors=False, iterations=4096, random_seed=1, restarts=1)); print((result.after.objective, tuple(sorted(result.layout.positions.items())), tuple((wire.source_entity, wire.source_connector_id, wire.target_entity, wire.target_connector_id, wire.color.value) for wire in result.layout.wires)))'
          done
