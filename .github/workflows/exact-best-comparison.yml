name: Exact best comparison

on:
  push:
    branches:
      - agent/annealing-v2-exact-best-tracking

jobs:
  compare:
    if: "${{ github.event.head_commit.message == 'ci: run exact-best short-stride matrix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Compare exact-best short sampling strides
        run: >-
          uv run python -m benchmarks.layout_optimizer_exact_best_compare
          --proposals 4096 --seeds 3 --strides 1 2 4
