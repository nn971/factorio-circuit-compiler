name: Shared predicate fusion implementation

on:
  push:
    branches:
      - agent/shared-predicate-fusion
    paths:
      - .github/workflows/shared-predicate-fusion.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shared-predicate-fusion
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Apply generic shared-predicate fusion changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          # Abstract physical IR: Factorio deciders may have multiple normal outputs.
          replace_once(
              "src/factorio_circuit/ir/abstract_physical.py",
              '''@dataclass(frozen=True, slots=True)\nclass DeciderCombinator:\n''',
              '''@dataclass(frozen=True, slots=True)\nclass DeciderOutput:\n    """One additional normal output of a Factorio decider combinator."""\n\n    signal: int\n    constant: int = 1\n    copy_count_from_input: bool = False\n    copy_count_nets: tuple[int, ...] = ()\n\n    def __post_init__(self) -> None:\n        if self.copy_count_nets and not self.copy_count_from_input:\n            raise ValueError("copy-count net selection requires copy_count_from_input")\n\n\n@dataclass(frozen=True, slots=True)\nclass DeciderCombinator:\n''',
          )
          replace_once(
              "src/factorio_circuit/ir/abstract_physical.py",
              '''    additional_conditions: tuple[DeciderCondition, ...] = ()\n    else_output_signal: int | None = None\n''',
              '''    additional_conditions: tuple[DeciderCondition, ...] = ()\n    additional_outputs: tuple[DeciderOutput, ...] = ()\n    else_output_signal: int | None = None\n''',
          )
          replace_once(
              "src/factorio_circuit/ir/abstract_physical.py",
              '''                for condition in entity.additional_conditions:\n                    self._validate_operand(condition.left, signal_ids, net_ids)\n                    self._validate_operand(condition.right, signal_ids, net_ids)\n                if entity.else_output_signal is not None:\n''',
              '''                for condition in entity.additional_conditions:\n                    self._validate_operand(condition.left, signal_ids, net_ids)\n                    self._validate_operand(condition.right, signal_ids, net_ids)\n                for output in entity.additional_outputs:\n                    _require(signal_ids, output.signal, "signal")\n                    self._validate_net_refs(output.copy_count_nets, net_ids)\n                if entity.else_output_signal is not None:\n''',
          )

          # Concrete physical IR mirrors the additional decider outputs.
          replace_once(
              "src/factorio_circuit/ir/physical.py",
              '''@dataclass(frozen=True, slots=True)\nclass DeciderCombinator:\n''',
              '''@dataclass(frozen=True, slots=True)\nclass DeciderOutput:\n    signal: SignalId\n    constant: int = 1\n    copy_count_from_input: bool = False\n    output_networks: tuple[WireColor, ...] | None = None\n\n\n@dataclass(frozen=True, slots=True)\nclass DeciderCombinator:\n''',
          )
          replace_once(
              "src/factorio_circuit/ir/physical.py",
              '''    additional_conditions: tuple[DeciderCondition, ...] = ()\n    else_output_signal: SignalId | None = None\n''',
              '''    additional_conditions: tuple[DeciderCondition, ...] = ()\n    additional_outputs: tuple[DeciderOutput, ...] = ()\n    else_output_signal: SignalId | None = None\n''',
          )

          # Both blueprint encoders serialize all normal decider outputs.
          for encoder in (
              "src/factorio_circuit/blueprint/encode.py",
              "src/factorio_circuit/blueprint/layout_encode.py",
          ):
              replace_once(
                  encoder,
                  '''    output = _decider_output(\n        entity.output_signal,\n        copy_count=entity.output_copy_count_from_input,\n        constant=entity.output_constant,\n        networks=entity.output_networks,\n    )\n    if entity.else_output_signal is not None:\n        raise ValueError("the current Factorio target does not support decider else outputs")\n    return {"conditions": conditions, "outputs": [output]}\n''',
                  '''    outputs = [\n        _decider_output(\n            entity.output_signal,\n            copy_count=entity.output_copy_count_from_input,\n            constant=entity.output_constant,\n            networks=entity.output_networks,\n        )\n    ]\n    outputs.extend(\n        _decider_output(\n            output.signal,\n            copy_count=output.copy_count_from_input,\n            constant=output.constant,\n            networks=output.output_networks,\n        )\n        for output in entity.additional_outputs\n    )\n    if entity.else_output_signal is not None:\n        raise ValueError("the current Factorio target does not support decider else outputs")\n    return {"conditions": conditions, "outputs": outputs}\n''',
              )

          # Physical synthesis materializes the extra abstract outputs.
          replace_once(
              "src/factorio_circuit/synthesis/physical.py",
              '''    DeciderCombinator,\n    DeciderCondition,\n    InputPort,\n''',
              '''    DeciderCombinator,\n    DeciderCondition,\n    DeciderOutput,\n    InputPort,\n''',
          )
          replace_once(
              "src/factorio_circuit/synthesis/physical.py",
              '''                additional_conditions=tuple(\n                    DeciderCondition(\n                        comparator=condition.comparator,\n                        left=self._operand(condition.left, signals, net_colors),\n                        right=self._operand(condition.right, signals, net_colors),\n                        compare_type=condition.compare_type,\n                    )\n                    for condition in entity.additional_conditions\n                ),\n                else_output_signal=(\n''',
              '''                additional_conditions=tuple(\n                    DeciderCondition(\n                        comparator=condition.comparator,\n                        left=self._operand(condition.left, signals, net_colors),\n                        right=self._operand(condition.right, signals, net_colors),\n                        compare_type=condition.compare_type,\n                    )\n                    for condition in entity.additional_conditions\n                ),\n                additional_outputs=tuple(\n                    DeciderOutput(\n                        signal=signals[output.signal],\n                        constant=output.constant,\n                        copy_count_from_input=output.copy_count_from_input,\n                        output_networks=self._network_selection(\n                            output.copy_count_nets, net_colors\n                        ),\n                    )\n                    for output in entity.additional_outputs\n                ),\n                else_output_signal=(\n''',
          )

          # Simulator: in Each mode every matching lane contributes independently to every output.
          simulator = Path("src/factorio_circuit/simulate/physical.py")
          text = simulator.read_text()
          pattern = re.compile(r"def _eval_decider\(.*?\n\n\ndef _decider_conditions_match", re.S)
          match = pattern.search(text)
          if match is None:
              raise SystemExit("could not locate _eval_decider")
          replacement = '''def _eval_decider(entity: DeciderCombinator, inputs: InputNetworks) -> SignalMap:\n    conditions = [\n        (entity.comparator, entity.left, entity.right, None),\n        *(\n            (condition.comparator, condition.left, condition.right, condition.compare_type)\n            for condition in entity.additional_conditions\n        ),\n    ]\n    outputs = [\n        (\n            entity.output_signal,\n            entity.output_copy_count_from_input,\n            entity.output_constant,\n            entity.output_networks,\n        ),\n        *(\n            (\n                output.signal,\n                output.copy_count_from_input,\n                output.constant,\n                output.output_networks,\n            )\n            for output in entity.additional_outputs\n        ),\n    ]\n    each_operands = [\n        operand\n        for _comparator, left, right, _compare_type in conditions\n        for operand in (left, right)\n        if operand.each\n    ]\n\n    if each_operands:\n        lanes: set[SignalId] = set()\n        for operand in each_operands:\n            lanes.update(_combined_inputs(inputs, operand.networks))\n        result: SignalMap = {}\n        for lane in lanes:\n            if not _decider_conditions_match(conditions, inputs, each_signal=lane):\n                continue\n            for signal, copy_count, constant, networks in outputs:\n                value = (\n                    _read_signal(lane, inputs, networks)\n                    if copy_count\n                    else i32(constant)\n                )\n                _add_signal(result, signal, value)\n        return result\n\n    if _decider_conditions_match(conditions, inputs):\n        result: SignalMap = {}\n        for signal, copy_count, constant, networks in outputs:\n            for output_signal, value in _decider_output(\n                signal, copy_count, constant, networks, inputs\n            ).items():\n                _add_signal(result, output_signal, value)\n        return result\n    if entity.else_output_signal is not None:\n        return _decider_output(\n            entity.else_output_signal,\n            entity.else_copy_count_from_input,\n            entity.else_output_constant,\n            entity.else_output_networks,\n            inputs,\n        )\n    return {}\n\n\ndef _decider_conditions_match'''
          simulator.write_text(text[:match.start()] + replacement + text[match.end():])

          # Lowering: shared Compare -> Select groups can inline the comparison; terminal
          # groups may use the verified multi-output bundle because no later consumer needs
          # the results split back into single-lane nets.
          lowerer = "src/factorio_circuit/lowering/ir_to_abstract_physical.py"
          replace_once(
              lowerer,
              '''    DeciderCombinator,\n    DeciderCondition,\n    Endpoint,\n''',
              '''    DeciderCombinator,\n    DeciderCondition,\n    DeciderOutput,\n    Endpoint,\n''',
          )
          replace_once(
              lowerer,
              '''        self.partition_for_op: dict[int, ArithmeticPartition] = {}\n        self.pairwise_partition_for_op: dict[int, PairwiseArithmeticPartition] = {}\n        if enable_packing:\n''',
              '''        self.partition_for_op: dict[int, ArithmeticPartition] = {}\n        self.pairwise_partition_for_op: dict[int, PairwiseArithmeticPartition] = {}\n        self.shared_selects_by_condition: dict[int, tuple[Select, ...]] = {}\n        self.output_value_ids = {id(value) for value in module.output.values}\n        if enable_packing:\n''',
          )
          replace_once(
              lowerer,
              '''            for pairwise_partition in partition_pairwise_arithmetic(module):\n                if len(pairwise_partition.operations) > 1:\n                    for op in pairwise_partition.operations:\n                        self.pairwise_partition_for_op[id(op)] = pairwise_partition\n''',
              '''            for pairwise_partition in partition_pairwise_arithmetic(module):\n                if len(pairwise_partition.operations) > 1:\n                    for op in pairwise_partition.operations:\n                        self.pairwise_partition_for_op[id(op)] = pairwise_partition\n            select_groups: dict[int, list[Select]] = {}\n            for op in module.operations:\n                if isinstance(op, Select) and isinstance(op.condition, Compare):\n                    select_groups.setdefault(id(op.condition), []).append(op)\n            self.shared_selects_by_condition = {\n                key: tuple(values) for key, values in select_groups.items() if len(values) > 1\n            }\n''',
          )

          old_select = '''    def _realize_select(self, select: Select) -> RealizedValue:\n        condition = self.realize(select.condition)\n'''
          new_select = '''    def _realize_select(self, select: Select) -> RealizedValue:\n        if self.enable_packing and isinstance(select.condition, Compare):\n            fused = self._try_emit_shared_compare_selects(select)\n            if fused is not None:\n                return fused\n            inlined = self._try_emit_inline_compare_select(select)\n            if inlined is not None:\n                return inlined\n\n        condition = self.realize(select.condition)\n'''
          replace_once(lowerer, old_select, new_select)

          insert_marker = '''    def _realize_select(self, select: Select) -> RealizedValue:\n'''
          helper_code = '''    def _try_emit_shared_compare_selects(\n        self, seed: Select\n    ) -> RealizedValue | None:\n        condition = seed.condition\n        if not isinstance(condition, Compare):\n            return None\n        group = self.shared_selects_by_condition.get(id(condition), ())\n        if len(group) < 2 or any(id(item) in self.memo for item in group):\n            return None\n        if not all(id(item) in self.output_value_ids for item in group):\n            return None\n\n        prepared = self._prepare_compare_select(condition, group)\n        if prepared is None:\n            return None\n        left, right, phase = prepared\n\n        true_outputs: list[DeciderOutput] = []\n        false_outputs: list[DeciderOutput] = []\n        output_signals: list[int] = []\n        for item in group:\n            true_source = self._select_compare_source(item.when_true, condition, left, right)\n            false_source = self._select_compare_source(item.when_false, condition, left, right)\n            if true_source is None or false_source is None or true_source is false_source:\n                return None\n            output_signal = self._new_signal(item.name or "select")\n            output_signals.append(output_signal)\n            true_outputs.append(\n                DeciderOutput(\n                    signal=output_signal,\n                    copy_count_from_input=True,\n                    copy_count_nets=(true_source.net,),\n                )\n            )\n            false_outputs.append(\n                DeciderOutput(\n                    signal=output_signal,\n                    copy_count_from_input=True,\n                    copy_count_nets=(false_source.net,),\n                )\n            )\n\n        true_entity = self._emit_direct_compare_decider(\n            condition,\n            left,\n            right,\n            primary=true_outputs[0],\n            additional=tuple(true_outputs[1:]),\n            comparator=condition.op,\n            description=f"fused {len(group)}-output compare/select true branch",\n        )\n        false_entity = self._emit_direct_compare_decider(\n            condition,\n            left,\n            right,\n            primary=false_outputs[0],\n            additional=tuple(false_outputs[1:]),\n            comparator=_complement_compare(condition.op),\n            description=f"fused {len(group)}-output compare/select false branch",\n        )\n        self._commit_compare_lane_constraints(left, right)\n        output_net = self._new_net(\n            tuple(output_signals),\n            Endpoint(true_entity.id, Connector.OUTPUT),\n            label="fused compare/select outputs",\n        )\n        self._attach(output_net, Endpoint(false_entity.id, Connector.OUTPUT))\n        for item, output_signal in zip(group, output_signals, strict=True):\n            self.memo[id(item)] = RealizedValue(\n                output_signal, output_net, phase + 1, clean_single_lane=False\n            )\n        return self.memo[id(seed)]\n\n    def _try_emit_inline_compare_select(self, select: Select) -> RealizedValue | None:\n        condition = select.condition\n        if not isinstance(condition, Compare):\n            return None\n        if id(condition) not in self.shared_selects_by_condition:\n            return None\n        prepared = self._prepare_compare_select(condition, (select,))\n        if prepared is None:\n            return None\n        left, right, phase = prepared\n        true_source = self._select_compare_source(select.when_true, condition, left, right)\n        false_source = self._select_compare_source(select.when_false, condition, left, right)\n        if true_source is None or false_source is None or true_source is false_source:\n            return None\n\n        output_signal = self._new_signal(select.name or "select")\n        true_output = DeciderOutput(\n            signal=output_signal,\n            copy_count_from_input=True,\n            copy_count_nets=(true_source.net,),\n        )\n        false_output = DeciderOutput(\n            signal=output_signal,\n            copy_count_from_input=True,\n            copy_count_nets=(false_source.net,),\n        )\n        true_entity = self._emit_direct_compare_decider(\n            condition,\n            left,\n            right,\n            primary=true_output,\n            additional=(),\n            comparator=condition.op,\n            description=f"{select.name or 'select'}: direct compare true branch",\n        )\n        false_entity = self._emit_direct_compare_decider(\n            condition,\n            left,\n            right,\n            primary=false_output,\n            additional=(),\n            comparator=_complement_compare(condition.op),\n            description=f"{select.name or 'select'}: direct compare false branch",\n        )\n        self._commit_compare_lane_constraints(left, right)\n        output_net = self._new_net(\n            (output_signal,),\n            Endpoint(true_entity.id, Connector.OUTPUT),\n            label=select.name or "direct compare/select",\n        )\n        self._attach(output_net, Endpoint(false_entity.id, Connector.OUTPUT))\n        result = RealizedValue(output_signal, output_net, phase + 1)\n        self.memo[id(select)] = result\n        return result\n\n    def _prepare_compare_select(\n        self, condition: Compare, group: tuple[Select, ...]\n    ) -> tuple[RealizedValue, RealizedValue, int] | None:\n        if any(\n            self._select_compare_source(item.when_true, condition, None, None) is None\n            or self._select_compare_source(item.when_false, condition, None, None) is None\n            for item in group\n        ):\n            return None\n        left_value = self._realize_operand_value(condition.left)\n        right_value = self._realize_operand_value(condition.right)\n        if not isinstance(left_value, RealizedValue) or not isinstance(right_value, RealizedValue):\n            return None\n        left, right, phase = self._align(left_value, right_value)\n        assert isinstance(left, RealizedValue) and isinstance(right, RealizedValue)\n        if not (left.clean_single_lane and right.clean_single_lane):\n            return None\n        if not (isinstance(left.signal, int) and isinstance(right.signal, int)):\n            return None\n        if left.net == right.net:\n            return None\n        if not self._signal_constraints_consistent([(left.signal, right.signal)], []):\n            return None\n        if not self._net_constraints_bipartite([(left.net, right.net)]):\n            return None\n        return left, right, phase\n\n    @staticmethod\n    def _select_compare_source(\n        value: Value,\n        condition: Compare,\n        left: RealizedValue | None,\n        right: RealizedValue | None,\n    ) -> RealizedValue | None:\n        if value is condition.left:\n            return left\n        if value is condition.right:\n            return right\n        return None\n\n    def _emit_direct_compare_decider(\n        self,\n        condition: Compare,\n        left: RealizedValue,\n        right: RealizedValue,\n        *,\n        primary: DeciderOutput,\n        additional: tuple[DeciderOutput, ...],\n        comparator: str,\n        description: str,\n    ) -> DeciderCombinator:\n        entity = DeciderCombinator(\n            id=self._take_entity_id(),\n            comparator=comparator,\n            left=Operand(each=True, nets=(left.net,)),\n            right=Operand(each=True, nets=(right.net,)),\n            output_signal=primary.signal,\n            output_constant=primary.constant,\n            output_copy_count_from_input=primary.copy_count_from_input,\n            copy_count_nets=primary.copy_count_nets,\n            additional_outputs=additional,\n            description=description,\n        )\n        self.circuit.entities.append(entity)\n        endpoint = Endpoint(entity.id, Connector.INPUT)\n        self._attach(left.net, endpoint)\n        self._attach(right.net, endpoint)\n        return entity\n\n    def _commit_compare_lane_constraints(\n        self, left: RealizedValue, right: RealizedValue\n    ) -> None:\n        assert isinstance(left.signal, int) and isinstance(right.signal, int)\n        self._add_signal_alias(\n            left.signal,\n            right.signal,\n            "direct Each comparison operands must use the same concrete signal lane",\n        )\n        self._add_net_conflict(\n            left.net,\n            right.net,\n            "direct Each comparison operands must use opposite wire colors",\n        )\n\n'''
          lowerer_path = Path(lowerer)
          lowerer_text = lowerer_path.read_text()
          if insert_marker not in lowerer_text:
              raise SystemExit("could not locate _realize_select insertion point")
          lowerer_path.write_text(lowerer_text.replace(insert_marker, helper_code + insert_marker, 1))

          # Comparator complement for false branches.
          lowerer_path = Path(lowerer)
          lowerer_text = lowerer_path.read_text()
          lowerer_text += '''\n\ndef _complement_compare(op: str) -> str:\n    complements = {\n        "==": "!=",\n        "!=": "==",\n        "<": ">=",\n        "<=": ">",\n        ">": "<=",\n        ">=": "<",\n    }\n    try:\n        return complements[op]\n    except KeyError as exc:  # pragma: no cover - semantic IR validates comparators\n        raise ValueError(f"unsupported comparison operator {op!r}") from exc\n'''
          lowerer_path.write_text(lowerer_text)

          # Regression tests: generic min/max fusion, sorter semantics, and real blueprint JSON.
          Path("tests/integration/test_shared_predicate_fusion.py").write_text('''from __future__ import annotations\n\nimport base64\nimport json\nimport zlib\n\nfrom examples.sorting_network import build_sorting_circuit\nfrom factorio_circuit import Circuit, compile_abstract_circuit, compile_circuit\nfrom factorio_circuit.ir.abstract_physical import DeciderCombinator\nfrom factorio_circuit.simulate.compare import assert_same_values\n\n\ndef _minmax() -> Circuit:\n    circuit = Circuit("minmax")\n    left = circuit.input("left")\n    right = circuit.input("right")\n    swap = left > right\n    circuit.output("lo", swap.select(right, left))\n    circuit.output("hi", swap.select(left, right))\n    return circuit\n\n\ndef test_terminal_shared_predicate_fuses_into_two_multi_output_deciders() -> None:\n    result = compile_abstract_circuit(_minmax())\n\n    deciders = [\n        entity\n        for entity in result.abstract_physical.entities\n        if isinstance(entity, DeciderCombinator)\n    ]\n    assert result.abstract_physical.combinator_count == 2\n    assert result.physical_circuit.combinator_count == 2\n    assert len(deciders) == 2\n    assert all(len(entity.additional_outputs) == 1 for entity in deciders)\n    assert result.physical_circuit.output_phases == (1, 1)\n    assert_same_values(\n        result.semantic_ir,\n        result.physical_circuit,\n        [\n            {"left": 7, "right": 3},\n            {"left": 2, "right": 9},\n            {"left": 0, "right": 0},\n            {"left": -5, "right": 4},\n            {"left": 8, "right": -11},\n        ],\n    )\n\n\ndef test_sort8_shared_predicates_inline_without_losing_single_lane_chaining() -> None:\n    result = compile_abstract_circuit(build_sorting_circuit(3))\n\n    assert result.physical_circuit.combinator_count < 100\n    assert max(result.physical_circuit.output_phases) == 6\n    assert_same_values(\n        result.semantic_ir,\n        result.physical_circuit,\n        [\n            {f"x{i}": 7 - i for i in range(8)},\n            {f"x{i}": (-1) ** i * (i + 1) for i in range(8)},\n            {f"x{i}": 0 if i % 3 == 0 else i - 4 for i in range(8)},\n        ],\n    )\n\n\ndef test_sort8_real_blueprint_serializes_multi_output_deciders() -> None:\n    result = compile_circuit(build_sorting_circuit(3))\n    assert result.blueprint_string.startswith("0")\n    decoded = json.loads(zlib.decompress(base64.b64decode(result.blueprint_string[1:])))\n    deciders = [\n        entity\n        for entity in decoded["blueprint"]["entities"]\n        if entity["name"] == "decider-combinator"\n    ]\n    assert any(\n        len(entity["control_behavior"]["decider_conditions"]["outputs"]) > 1\n        for entity in deciders\n    )\n''')
          PY

      - name: Install development environment
        run: uv sync --extra dev

      - name: Test and type-check
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src

      - name: Generate real benchmark blueprints
        shell: bash
        run: |
          uv run python examples/sorting_network.py 3 > /tmp/sort8.txt
          uv run python examples/walsh_hadamard.py 5 > /tmp/wht32.txt
          head -n 2 /tmp/sort8.txt
          head -n 2 /tmp/wht32.txt
          python - <<'PY'
          from pathlib import Path
          for path in (Path('/tmp/sort8.txt'), Path('/tmp/wht32.txt')):
              last = path.read_text().splitlines()[-1]
              assert last.startswith('0') and len(last) > 100
          PY

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests/integration/test_shared_predicate_fusion.py
          git diff --cached --check
          git commit -m "feat(lowering): fuse shared compare predicates"
          git push origin HEAD:agent/shared-predicate-fusion
