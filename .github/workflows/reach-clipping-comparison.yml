name: Reach clipping comparison

on:
  push:
    branches:
      - agent/annealing-v2-reach-clipping

jobs:
  compare:
    if: "${{ github.event.head_commit.message == 'ci: run analytical clipping comparison' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Compare baseline and analytical clipping
        run: uv run python -m benchmarks.layout_optimizer_reach_clipping_compare --proposals 4096 --seeds 3
