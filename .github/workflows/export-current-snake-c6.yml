name: Export current Snake C6 artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Export current C6/C5 Snake artifact
        run: |
          mkdir -p /tmp/current-snake
          uv run python -m benchmarks.snake.export_current_c6 --output-dir /tmp/current-snake
      - name: Preserve current Snake artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-current-c6-c5
          path: /tmp/current-snake
