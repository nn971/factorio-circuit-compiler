name: Anchored worker validation

on:
  push:
    branches:
      - agent/anchored-worker-validation
    paths-ignore:
      - validation/anchored-worker-result.txt
      - validation/anchored-worker-probe.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/anchored-worker-validation
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run validation suite
        shell: bash
        run: |
          set +e
          mkdir -p validation
          RESULT=validation/anchored-worker-result.txt
          PROBE=validation/anchored-worker-probe.txt
          : > "$RESULT"
          rm -f "$PROBE"
          overall=0

          record() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a "$RESULT"
            "$@" > /tmp/anchored-worker-step.log 2>&1
            code=$?
            cat /tmp/anchored-worker-step.log | tee -a "$RESULT"
            echo "exit_code=$code" | tee -a "$RESULT"
            echo | tee -a "$RESULT"
            if [ "$code" -ne 0 ]; then
              overall=1
            fi
          }

          echo "source_commit=$GITHUB_SHA" >> "$RESULT"
          echo >> "$RESULT"
          record "focused pytest" uv run pytest \
            tests/devices/test_anchors.py \
            tests/devices/test_assembler_device.py \
            tests/examples/autonomous_mall/test_anchored_worker.py
          record "full pytest" uv run pytest
          record "ruff check" uv run ruff check .
          record "ruff format" uv run ruff format --check .
          record "mypy src" uv run mypy src
          record "probe generation" bash -lc \
            'uv run python -m examples.autonomous_mall.anchored_worker_probe > validation/anchored-worker-probe.txt'

          echo "overall_exit_code=$overall" | tee -a "$RESULT"
          echo "VALIDATION_EXIT=$overall" >> "$GITHUB_ENV"

      - name: Commit validation result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/anchored-worker-result.txt
          if [ -f validation/anchored-worker-probe.txt ]; then
            git add validation/anchored-worker-probe.txt
          fi
          git commit -m "Record anchored worker validation for ${GITHUB_SHA::12}" || true
          git push origin HEAD:agent/anchored-worker-validation

      - name: Fail when validation failed
        if: env.VALIDATION_EXIT != '0'
        run: exit 1
