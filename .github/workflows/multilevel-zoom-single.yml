name: Snake multilevel zoom single

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Measure one macro zoom
        run: uv run python -m benchmarks.snake.multilevel_zoom_probe --target-macros 32 --zoom-scale 0.15
