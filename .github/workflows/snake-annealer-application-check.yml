name: Snake annealer application check

on:
  pull_request:

permissions:
  contents: read

jobs:
  mapped-snake-annealer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Anneal accepted mapped Snake — 512 proposals
        shell: bash
        run: |
          mkdir -p /tmp/snake-mapped-annealer-artifacts
          uv run --with 'ortools>=9.14,<10' \
            python -m benchmarks.snake.check_mapped_annealer \
            --proposals 512 \
            --seed 0 \
            --period 60 \
            --time-limit 300 \
            --workers 8 \
            --output /tmp/snake-mapped-annealer-artifacts/snake-mapped-annealed-512-seed0.txt \
            2> >(tee /tmp/snake-mapped-annealer-artifacts/snake-mapped-annealed-512-seed0.log >&2)
      - name: Blueprint artifact census
        shell: bash
        run: |
          uv run python - <<'PY' | tee /tmp/snake-mapped-annealer-artifacts/blueprint-census.log
          from hashlib import sha256
          from pathlib import Path
          from factorio_circuit.devices._blueprint import decode_blueprint

          path = Path('/tmp/snake-mapped-annealer-artifacts/snake-mapped-annealed-512-seed0.txt')
          payload = path.read_text().strip()
          decoded = decode_blueprint(payload)
          print(
              f'{path.name}: bytes={len(payload.encode())} sha256={sha256(payload.encode()).hexdigest()} '
              f'entities={len(decoded.get("entities", []))} wires={len(decoded.get("wires", []))}'
          )
          PY
      - name: Preserve mapped Snake blueprint and logs
        uses: actions/upload-artifact@v4
        with:
          name: snake-mapped-current-annealer-check
          path: /tmp/snake-mapped-annealer-artifacts
