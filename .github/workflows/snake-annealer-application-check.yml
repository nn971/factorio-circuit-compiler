name: Snake annealer application check

on:
  pull_request:

permissions:
  contents: read

jobs:
  snake-annealer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Full Snake semantic acceptance
        run: |
          mkdir -p /tmp/snake-annealer-artifacts
          uv run python -m benchmarks.snake.semantic_acceptance \
            | tee /tmp/snake-annealer-artifacts/semantic-acceptance.log
      - name: Anneal safe-folded Snake — 512 proposals
        shell: bash
        run: |
          uv run python -m benchmarks.snake.generate \
            --anneal-safe-folded-seed \
            --annealing-iterations 512 \
            --layout-seed 0 \
            --layout-retries 1 \
            --census \
            --no-progress \
            --output /tmp/snake-annealer-artifacts/snake-annealed-512-seed0.txt \
            2> >(tee /tmp/snake-annealer-artifacts/snake-annealed-512-seed0.log >&2)
      - name: Anneal safe-folded Snake — 4096 proposals
        shell: bash
        run: |
          uv run python -m benchmarks.snake.generate \
            --anneal-safe-folded-seed \
            --annealing-iterations 4096 \
            --layout-seed 0 \
            --layout-retries 1 \
            --census \
            --no-progress \
            --output /tmp/snake-annealer-artifacts/snake-annealed-4096-seed0.txt \
            2> >(tee /tmp/snake-annealer-artifacts/snake-annealed-4096-seed0.log >&2)
      - name: Blueprint artifact census
        shell: bash
        run: |
          uv run python - <<'PY' | tee /tmp/snake-annealer-artifacts/blueprint-census.log
          from hashlib import sha256
          from pathlib import Path
          from factorio_circuit.devices._blueprint import decode_blueprint

          root = Path('/tmp/snake-annealer-artifacts')
          for name in ('snake-annealed-512-seed0.txt', 'snake-annealed-4096-seed0.txt'):
              path = root / name
              payload = path.read_text().strip()
              decoded = decode_blueprint(payload)
              print(
                  f'{name}: bytes={len(payload.encode())} sha256={sha256(payload.encode()).hexdigest()} '
                  f'entities={len(decoded.get("entities", []))} wires={len(decoded.get("wires", []))}'
              )
          PY
      - name: Preserve Snake blueprints and logs
        uses: actions/upload-artifact@v4
        with:
          name: snake-current-annealer-application-check
          path: /tmp/snake-annealer-artifacts
