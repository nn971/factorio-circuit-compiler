name: Snake global zoom probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  snake-global-zoom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run global zoom on failproof Snake
        run: uv run python -m benchmarks.snake.global_zoom_probe --max-passes 4
