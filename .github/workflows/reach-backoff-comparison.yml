name: Reach backoff comparison

on:
  push:
    branches:
      - agent/annealing-v2-reach-backoff

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Compare baseline and reach backoff
        run: uv run python -m benchmarks.layout_optimizer_reach_backoff_compare --proposals 4096 --seeds 3
