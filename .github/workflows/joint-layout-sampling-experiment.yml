name: Joint layout sampling experiment

on:
  push:
    branches:
      - agent/annealed-joint-layout-sampling-experiment

permissions:
  contents: read

jobs:
  snake-span-trace:
    strategy:
      fail-fast: false
      matrix:
        seed:
          - 0
          - 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/annealed-joint-layout-implementation-priority
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Patch annealing seed and span tracing
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          seed = int(os.environ["SEED"])
          generate_path = Path("benchmarks/snake/generate.py")
          generate = generate_path.read_text()
          old_seed = "        retry_fill_scale=0.8,\n"
          new_seed = old_seed + f"        random_seed={seed},\n"
          if old_seed not in generate:
              raise SystemExit("Snake placement option site not found")
          generate_path.write_text(generate.replace(old_seed, new_seed, 1))

          path = Path("src/factorio_circuit/synthesis/incremental_joint_layout.py")
          source = path.read_text()
          old_setup = '''    occupancy = _SpatialOccupancy.build(state)
              rng = Random(options.random_seed ^ 0x61A7E5ED)

              best_score = _exact_score(state, topology, center)
          '''
          new_setup = '''    occupancy = _SpatialOccupancy.build(state)
              rng = Random(options.random_seed ^ 0x61A7E5ED)

              def trace_span(label: str) -> None:
                  object_ids = [*state.positions, *state.relay_positions]
                  top = min(
                      state.object_position(item)[1] - state.object_half_extent(item)[1]
                      for item in object_ids
                  )
                  bottom = max(
                      state.object_position(item)[1] + state.object_half_extent(item)[1]
                      for item in object_ids
                  )
                  print(
                      f"SPAN_TRACE label={label} relays={len(state.relay_positions)} "
                      f"top={top:.1f} bottom={bottom:.1f} height={bottom - top:.1f}"
                  )

              trace_span("initial")
              best_score = _exact_score(state, topology, center)
          '''
          old_epoch = '''        topology = _simplify_feasible_topology(state, topology)
                  occupancy = _SpatialOccupancy.build(state)
                  score = _exact_score(state, topology, center)
          '''
          new_epoch = '''        topology = _simplify_feasible_topology(state, topology)
                  occupancy = _SpatialOccupancy.build(state)
                  trace_span(f"epoch-{epoch_end}")
                  score = _exact_score(state, topology, center)
          '''
          if old_setup not in source or old_epoch not in source:
              raise SystemExit("annealing instrumentation sites not found")
          source = source.replace(old_setup, new_setup, 1)
          source = source.replace(old_epoch, new_epoch, 1)
          path.write_text(source)
          PY
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run 1000-proposal Snake layout
        run: |
          echo "BENCHMARK_SEED=${{ matrix.seed }}"
          uv run python -m benchmarks.snake.generate \
            --annealing-layout \
            --annealing-iterations 1000 \
            --layout-retries 1 \
            --census \
            --output snake-annealed-blueprint.txt
