name: Joint layout sampling experiment

on:
  push:
    branches:
      - agent/annealed-joint-layout-sampling-experiment

permissions:
  contents: read

jobs:
  committed-snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/annealed-joint-layout-vertical-overflow
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set deterministic Snake seed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("benchmarks/snake/generate.py")
          source = path.read_text()
          old = "        retry_fill_scale=0.8,\n"
          if old not in source:
              raise SystemExit("Snake placement option site not found")
          path.write_text(source.replace(old, old + "        random_seed=0,\n", 1))
          PY
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run committed 1000-proposal Snake layout
        run: |
          /usr/bin/time -f 'BENCHMARK_WALL_SECONDS=%e' \
            uv run python -m benchmarks.snake.generate \
              --annealing-layout \
              --annealing-iterations 1000 \
              --layout-retries 1 \
              --census \
              --output snake-annealed-blueprint.txt
