name: Joint layout sampling experiment

on:
  push:
    branches:
      - agent/annealed-joint-layout-sampling-experiment

permissions:
  contents: write

jobs:
  promote-vertical-overflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/annealed-joint-layout-vertical-overflow
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply validated vertical overflow objective
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/factorio_circuit/synthesis/incremental_joint_layout.py")
          source = path.read_text()

          old_constants = '''_SLACK_START = 0.85
          _BOOTSTRAP_EXPANSIONS = 4
          '''
          new_constants = '''_SLACK_START = 0.85
          _VERTICAL_OVERFLOW_WEIGHT = 0.25
          _BOOTSTRAP_EXPANSIONS = 4
          '''

          old_setup = '''    occupancy = _SpatialOccupancy.build(state)
              rng = Random(options.random_seed ^ 0x61A7E5ED)

              best_score = _exact_score(state, topology, center)
          '''
          new_setup = '''    occupancy = _SpatialOccupancy.build(state)
              rng = Random(options.random_seed ^ 0x61A7E5ED)
              vertical_envelope = _vertical_envelope(state)

              best_score = _exact_score(state, topology, center)
          '''

          old_delta = '''            compact_delta = sum(
                          exact._compactness(position, center)
                          - exact._compactness(state.object_position(item), center)
                          for item, position in targets.items()
                      )
                      delta = wire_delta + compact_delta
          '''
          new_delta = '''            compact_delta = sum(
                          exact._compactness(position, center)
                          - exact._compactness(state.object_position(item), center)
                          for item, position in targets.items()
                      )
                      overflow_delta = sum(
                          _vertical_overflow(state, item, position, vertical_envelope)
                          - _vertical_overflow(
                              state,
                              item,
                              state.object_position(item),
                              vertical_envelope,
                          )
                          for item, position in targets.items()
                      )
                      delta = (
                          wire_delta
                          + compact_delta
                          + _VERTICAL_OVERFLOW_WEIGHT * overflow_delta
                      )
          '''

          old_helper_site = '''    return _FeasibleTopology.build(state, best_routing)


          def _exact_score(
          '''
          new_helper_site = '''    return _FeasibleTopology.build(state, best_routing)


          def _vertical_envelope(state: exact._JointState) -> tuple[float, float]:
              """Return the initial occupied vertical extent as (top, bottom)."""

              object_ids = [*state.positions, *state.relay_positions]
              if not object_ids:
                  return (0.0, 0.0)
              return (
                  min(
                      state.object_position(item)[1] - state.object_half_extent(item)[1]
                      for item in object_ids
                  ),
                  max(
                      state.object_position(item)[1] + state.object_half_extent(item)[1]
                      for item in object_ids
                  ),
              )


          def _vertical_overflow(
              state: exact._JointState,
              object_id: int,
              position: Position,
              envelope: tuple[float, float],
          ) -> float:
              """Quadratic overflow beyond a reference vertical envelope."""

              top, bottom = envelope
              half_y = state.object_half_extent(object_id)[1]
              above = max(0.0, top - (position[1] - half_y))
              below = max(0.0, (position[1] + half_y) - bottom)
              return above * above + below * below


          def _exact_score(
          '''

          replacements = (
              (old_constants, new_constants, "constant site"),
              (old_setup, new_setup, "annealing setup"),
              (old_delta, new_delta, "proposal energy"),
              (old_helper_site, new_helper_site, "vertical helper site"),
          )
          for old, new, label in replacements:
              if old not in source:
                  raise SystemExit(f"{label} not found")
              source = source.replace(old, new, 1)
          path.write_text(source)

          test_path = Path("tests/synthesis/test_incremental_joint_regressions.py")
          tests = test_path.read_text()
          marker = "def test_vertical_overflow_tracks_distance_beyond_initial_envelope"
          if marker in tests:
              raise SystemExit("vertical overflow tests already present")
          tests += '''


def test_vertical_overflow_tracks_distance_beyond_initial_envelope() -> None:
    state = _constant_state_with_relay()
    envelope = incremental._vertical_envelope(state)

    assert envelope == (-0.5, 0.5)
    assert incremental._vertical_overflow(state, 1, (0.0, 0.0), envelope) == 0.0
    assert incremental._vertical_overflow(state, 1, (0.0, 1.0), envelope) == pytest.approx(1.0)
    assert incremental._vertical_overflow(state, 3, (1.5, -1.0), envelope) == pytest.approx(1.0)


def test_vertical_overflow_penalty_is_local_to_reference_envelope() -> None:
    state = _constant_state_with_relay()
    envelope = incremental._vertical_envelope(state)

    inside = incremental._vertical_overflow(state, 2, (3.0, 0.0), envelope)
    one_row_below = incremental._vertical_overflow(state, 2, (3.0, 1.0), envelope)
    two_rows_below = incremental._vertical_overflow(state, 2, (3.0, 2.0), envelope)

    assert inside == 0.0
    assert one_row_below == pytest.approx(1.0)
    assert two_rows_below == pytest.approx(4.0)
'''
          test_path.write_text(tests)
          PY
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Format changed files
        run: uv run ruff format src/factorio_circuit/synthesis/incremental_joint_layout.py tests/synthesis/test_incremental_joint_regressions.py
      - name: Run focused regression tests
        run: uv run pytest tests/synthesis/test_incremental_joint_regressions.py
      - name: Run full test suite
        run: uv run pytest
      - name: Run lint and type checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/factorio_circuit/synthesis/incremental_joint_layout.py tests/synthesis/test_incremental_joint_regressions.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Penalize vertical annealing overflow"
          git push origin HEAD:agent/annealed-joint-layout-vertical-overflow
