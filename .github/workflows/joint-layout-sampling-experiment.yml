name: Joint layout sampling experiment

on:
  push:
    branches:
      - agent/annealed-joint-layout-sampling-experiment

permissions:
  contents: read

jobs:
  dense-envelope-sweep:
    strategy:
      fail-fast: false
      matrix:
        target_fill: [0.80, 0.85, 0.90, 0.95, 1.00]
        seed: [0, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/annealed-joint-layout-rebased
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Disable relay-capacity expansion and patch Snake seed
        env:
          SEED: ${{ matrix.seed }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          seed = int(os.environ["SEED"])

          path = Path("src/factorio_circuit/synthesis/open_vector.py")
          source = path.read_text()
          marker = '''    if relay_reserve <= 0:\n        return options.target_fill\n\n'''
          replacement = '''    # Experiment: retain the requested global density and let the\n    # feasible bootstrap itself decide whether the workspace is sufficient.\n    return options.target_fill\n\n'''
          if marker not in source:
              raise SystemExit("joint capacity prepass site not found")
          path.write_text(source.replace(marker, replacement, 1))

          generate = Path("benchmarks/snake/generate.py")
          source = generate.read_text()
          marker = "        retry_fill_scale=0.8,\n"
          if marker not in source:
              raise SystemExit("Snake placement option site not found")
          generate.write_text(source.replace(marker, marker + f"        random_seed={seed},\n", 1))
          PY
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run 1000-proposal Snake layout
        run: |
          echo "BENCHMARK_TARGET_FILL=${{ matrix.target_fill }}"
          echo "BENCHMARK_SEED=${{ matrix.seed }}"
          /usr/bin/time -f 'BENCHMARK_WALL_SECONDS=%e' \
            uv run python -m benchmarks.snake.generate \
              --annealing-layout \
              --annealing-iterations 1000 \
              --layout-retries 1 \
              --target-fill ${{ matrix.target_fill }} \
              --census \
              --output snake-annealed-blueprint.txt
