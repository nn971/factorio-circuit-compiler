name: Snake multilevel zoom probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  snake-multilevel-zoom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run Snake multilevel zoom probe
        run: uv run python -m benchmarks.snake.multilevel_probe --target-macros 32
