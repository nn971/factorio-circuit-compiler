name: Snake singleton zoom checkpoint

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run singleton zoom sweep
        run: |
          mkdir -p /tmp/singleton-zoom
          uv run python -m benchmarks.snake.singleton_zoom_checkpoint_probe \
            --coarse-proposals 8192 \
            --per-level-proposals 256 \
            --scales 0.80,0.85,0.875 \
            --zoom-radius 32 \
            --seed 0 \
            --final-site-search-radius 64 \
            --routing-margin-scale 2.0 \
            | tee /tmp/singleton-zoom/report.json
      - name: Preserve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snake-singleton-zoom-checkpoint
          path: /tmp/singleton-zoom/report.json
