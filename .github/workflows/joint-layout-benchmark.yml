name: Joint layout benchmark

on:
  pull_request:
    branches:
      - agent/annealed-joint-layout

permissions:
  contents: read

jobs:
  snake-ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            ref: agent/annealed-joint-layout
          - label: reach-aware
            ref: agent/annealed-joint-layout-neighborhood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run 1000-proposal Snake layout
        run: |
          echo "BENCHMARK_VARIANT=${{ matrix.label }}"
          /usr/bin/time -f 'BENCHMARK_WALL_SECONDS=%e' \
            uv run python -m benchmarks.snake.generate \
              --annealing-layout \
              --annealing-iterations 1000 \
              --layout-retries 1 \
              --census \
              --output snake-annealed-blueprint.txt
