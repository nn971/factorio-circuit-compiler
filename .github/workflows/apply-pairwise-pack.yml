name: Apply pairwise arithmetic packing

on:
  push:
    branches:
      - agent/pairwise-arithmetic-packing
    paths:
      - .github/workflows/apply-pairwise-pack.yml
      - scripts/apply_pairwise_pack.py.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pairwise-arithmetic-packing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Decode transformation
        run: |
          base64 -d scripts/apply_pairwise_pack.py.gz.b64 | gzip -d > /tmp/apply_pairwise_pack.py
          python -m py_compile /tmp/apply_pairwise_pack.py
      - name: Apply source transformation
        run: python /tmp/apply_pairwise_pack.py
      - name: Remove temporary transformation payload
        run: rm scripts/apply_pairwise_pack.py.gz.b64
      - name: Compile changed Python
        run: python -m compileall src tests examples
      - name: Pytest
        run: pytest
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Generate WHT-32 blueprint
        run: |
          python examples/walsh_hadamard.py 5 > /tmp/wht32.txt
          tail -n 1 /tmp/wht32.txt | grep '^0'
          head -n 2 /tmp/wht32.txt
      - name: Generate sorting-8 blueprint
        run: |
          python examples/sorting_network.py 3 > /tmp/sort8.txt
          tail -n 1 /tmp/sort8.txt | grep '^0'
          head -n 2 /tmp/sort8.txt
      - name: Show diff
        run: git diff --check && git diff --stat
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(lowering): pack pairwise arithmetic lanes'
          git push origin HEAD:agent/pairwise-arithmetic-packing
