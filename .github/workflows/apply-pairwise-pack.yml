name: Apply pairwise arithmetic packing

on:
  push:
    branches:
      - agent/pairwise-arithmetic-packing
    paths:
      - .github/workflows/apply-pairwise-pack.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pairwise-arithmetic-packing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Recover verified transformation from git history
        run: |
          git show 794306c484a3d2dcf720bbe053e666b75b061a07:scripts/apply_pairwise_pack.py.gz.b64 \
            | base64 -d | gzip -d > /tmp/apply_pairwise_pack.py
          python -m py_compile /tmp/apply_pairwise_pack.py
      - name: Apply source transformation
        run: python /tmp/apply_pairwise_pack.py
      - name: Fix strict typing in generated changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f"expected exactly one typing-fix target in {path}: {old!r}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "src/factorio_circuit/ir/abstract_physical.py",
              "conflict_pairs.add(tuple(sorted((signal_conflict.left, signal_conflict.right))))",
              "conflict_pairs.add((min(signal_conflict.left, signal_conflict.right), max(signal_conflict.left, signal_conflict.right)))",
          )
          replace_once(
              "src/factorio_circuit/ir/abstract_physical.py",
              "if tuple(sorted((signal_alias.left, signal_alias.right))) in conflict_pairs:",
              "if (min(signal_alias.left, signal_alias.right), max(signal_alias.left, signal_alias.right)) in conflict_pairs:",
          )

          path = "src/factorio_circuit/lowering/ir_to_abstract_physical.py"
          old = (
              "            for partition in partition_arithmetic(module):\n"
              "                if partition.key is not None and len(partition.operations) > 1:\n"
              "                    for op in partition.operations:\n"
              "                        self.partition_for_op[id(op)] = partition\n"
              "            for partition in partition_pairwise_arithmetic(module):\n"
              "                if len(partition.operations) > 1:\n"
              "                    for op in partition.operations:\n"
              "                        self.pairwise_partition_for_op[id(op)] = partition\n"
          )
          new = (
              "            for arithmetic_partition in partition_arithmetic(module):\n"
              "                if arithmetic_partition.key is not None and len(arithmetic_partition.operations) > 1:\n"
              "                    for op in arithmetic_partition.operations:\n"
              "                        self.partition_for_op[id(op)] = arithmetic_partition\n"
              "            for pairwise_partition in partition_pairwise_arithmetic(module):\n"
              "                if len(pairwise_partition.operations) > 1:\n"
              "                    for op in pairwise_partition.operations:\n"
              "                        self.pairwise_partition_for_op[id(op)] = pairwise_partition\n"
          )
          replace_once(path, old, new)

          old = (
              "        ordered = [seed_aligned, *(item for item in aligned if item[0] is not seed)]\n"
              "        selected: list[tuple[BinaryOp, RealizedValue, RealizedValue]] = []\n"
              "        for candidate in ordered:\n"
              "            trial = [*selected, candidate]\n"
              "            if self._pairwise_group_is_feasible(trial):\n"
              "                selected = trial\n"
          )
          new = (
              "        ordered = [seed_aligned, *(item for item in aligned if item[0] is not seed)]\n"
              "        selected: list[tuple[BinaryOp, RealizedValue, RealizedValue]] = []\n"
              "        for item in ordered:\n"
              "            trial: list[tuple[BinaryOp, RealizedValue, RealizedValue]] = [*selected, item]\n"
              "            if self._pairwise_group_is_feasible(trial):\n"
              "                selected = trial\n"
          )
          replace_once(path, old, new)
          PY
      - name: Remove temporary transformation payload
        run: rm -f scripts/apply_pairwise_pack.py.gz.b64
      - name: Canonicalize changed Python
        run: |
          ruff format .
          ruff check --fix .
          ruff format .
      - name: Compile changed Python
        run: python -m compileall src tests examples
      - name: Pytest
        run: pytest
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Generate WHT-32 blueprint
        run: |
          python examples/walsh_hadamard.py 5 > /tmp/wht32.txt
          tail -n 1 /tmp/wht32.txt | grep '^0'
          head -n 2 /tmp/wht32.txt
      - name: Generate sorting-8 blueprint
        run: |
          python examples/sorting_network.py 3 > /tmp/sort8.txt
          tail -n 1 /tmp/sort8.txt | grep '^0'
          head -n 2 /tmp/sort8.txt
      - name: Show diff
        run: git diff --check && git diff --stat
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(lowering): pack pairwise arithmetic lanes'
          git push origin HEAD:agent/pairwise-arithmetic-packing
