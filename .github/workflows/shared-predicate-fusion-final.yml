name: Shared predicate fusion corrected implementation

on:
  push:
    branches:
      - agent/shared-predicate-fusion
    paths:
      - .github/workflows/shared-predicate-fusion-final.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shared-predicate-fusion
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Apply corrected implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/shared-predicate-fusion.yml').read_text()
          section = workflow.split('      - name: Apply generic shared-predicate fusion changes\n', 1)[1]
          section = section.split('      - name: Install development environment\n', 1)[0]
          shell = section.split('        run: |\n', 1)[1]
          shell = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in shell.splitlines()
          )
          subprocess.run(['bash', '-e', '-o', 'pipefail'], input=shell, text=True, check=True)

          path = Path('src/factorio_circuit/lowering/ir_to_abstract_physical.py')
          text = path.read_text()
          bad = '''        if any(\n            self._select_compare_source(item.when_true, condition, None, None) is None\n            or self._select_compare_source(item.when_false, condition, None, None) is None\n            for item in group\n        ):\n            return None\n'''
          good = '''        if any(\n            not (item.when_true is condition.left or item.when_true is condition.right)\n            or not (item.when_false is condition.left or item.when_false is condition.right)\n            for item in group\n        ):\n            return None\n'''
          if bad not in text:
              raise SystemExit('expected generated compare/select preflight not found')
          path.write_text(text.replace(bad, good, 1))

          benchmark_test = Path('tests/integration/test_layout_benchmark_examples.py')
          benchmark_text = benchmark_test.read_text()
          stale_count = '    assert result.physical_circuit.combinator_count == 168\n'
          if stale_count not in benchmark_text:
              raise SystemExit('expected stale sorter-8 combinator assertion not found')
          benchmark_text = benchmark_text.replace(
              stale_count,
              '    assert result.physical_circuit.combinator_count == 88\n',
              1,
          )
          stale_structure = '''    assert any(\n        len(entity.get("control_behavior", {}).get("decider_conditions", {}).get("conditions", []))\n        > 1\n        for entity in result.blueprint_json["blueprint"]["entities"]\n    )\n'''
          refreshed_structure = '''    assert any(\n        len(entity.get("control_behavior", {}).get("decider_conditions", {}).get("outputs", []))\n        > 1\n        for entity in result.blueprint_json["blueprint"]["entities"]\n    )\n'''
          if stale_structure not in benchmark_text:
              raise SystemExit('expected stale sorter-8 decider-structure assertion not found')
          benchmark_test.write_text(
              benchmark_text.replace(stale_structure, refreshed_structure, 1)
          )
          PY

      - name: Install development environment
        run: uv sync --extra dev

      - name: Test and type-check
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src

      - name: Generate real benchmark blueprints
        shell: bash
        run: |
          uv run python examples/sorting_network.py 3 > /tmp/sort8.txt
          uv run python examples/walsh_hadamard.py 5 > /tmp/wht32.txt
          head -n 2 /tmp/sort8.txt
          head -n 2 /tmp/wht32.txt
          python - <<'PY'
          from pathlib import Path
          for path in (Path('/tmp/sort8.txt'), Path('/tmp/wht32.txt')):
              last = path.read_text().splitlines()[-1]
              assert last.startswith('0') and len(last) > 100
          PY

      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests/integration/test_shared_predicate_fusion.py tests/integration/test_layout_benchmark_examples.py
          git diff --cached --check
          git commit -m "feat(lowering): fuse shared compare predicates"
          git push origin HEAD:agent/shared-predicate-fusion
