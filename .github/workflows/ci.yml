name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Inspect Snake wire-sum candidates
        if: github.head_ref == 'agent/periodic-wire-sum'
        run: |
          uv run python - <<'PY'
          from collections import Counter
          from benchmarks.snake.model import build_snake_circuit
          from factorio_circuit.lowering.frontend_to_ir import lower_frontend
          from factorio_circuit.mapping import (
              ImplementationKind,
              add_decider_condition_cover_candidates,
              add_select_constant_candidates,
              add_wire_sum_candidates,
              build_periodic_state_mapping_problem,
              ordinary_candidates,
          )
          from factorio_circuit.sampling import SamplingPolicy

          module = lower_frontend(build_snake_circuit(render_framebuffer=True))
          problem = build_periodic_state_mapping_problem(
              module,
              period=60,
              output_phases=(119,) * len(module.output.values),
              sampling_policy=SamplingPolicy.ALAP,
          )
          candidates = ordinary_candidates(problem)
          candidates = add_select_constant_candidates(problem, candidates)
          candidates = add_decider_condition_cover_candidates(problem, candidates)
          candidates = add_wire_sum_candidates(problem, candidates)
          use_counts = Counter()
          for operation in problem.operations:
              use_counts.update(operation.operands)
          use_counts.update(sink.value for sink in problem.sinks)
          for transition in problem.state_transitions:
              if transition.value is not None:
                  use_counts[transition.value] += 1
              if transition.when is not None:
                  use_counts[transition.when] += 1
          wire = [item for item in candidates if item.kind is ImplementationKind.WIRE_SUM]
          print(f"wire_sum_candidates={len(wire)}")
          for candidate in wire:
              operation = problem.operation_by_id(candidate.operation)
              producers = [problem.operation_by_id(item) for item in operation.operands]
              print(
                  f"  op={operation.id} label={operation.label!r}; "
                  + "; ".join(
                      f"producer={producer.id} label={producer.label!r} "
                      f"type={type(producer.semantic).__name__} uses={use_counts[producer.id]}"
                      for producer in producers
                  )
              )
          PY
      - name: Test
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
