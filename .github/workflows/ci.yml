name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Bound reach-domain scan
        run: uv run python tools/_optimize_reach_mobile_pool_experiment.py
      - name: Format candidate
        run: uv run ruff format src/factorio_circuit/synthesis/incremental_joint_layout.py
      - name: Test
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Compare baseline and reach-mobile proposal filtering
        run: >-
          uv run python -m benchmarks.layout_optimizer_reach_pool_compare
          --proposals 4096 --seeds 8
