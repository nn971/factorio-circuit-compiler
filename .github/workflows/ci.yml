name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Diagnose Snake vector additions
        if: github.head_ref == 'agent/periodic-wire-sum'
        run: |
          uv run python - <<'PY'
          from collections import Counter
          from benchmarks.snake.model import build_snake_circuit
          from factorio_circuit.ir.semantic import BinaryOp, VectorBinaryOp
          from factorio_circuit.lowering.frontend_to_ir import lower_frontend
          from factorio_circuit.mapping import build_periodic_state_mapping_problem
          from factorio_circuit.sampling import SamplingPolicy

          module = lower_frontend(build_snake_circuit(render_framebuffer=True))
          problem = build_periodic_state_mapping_problem(
              module,
              period=60,
              output_phases=(119,) * len(module.output.values),
              sampling_policy=SamplingPolicy.ALAP,
          )
          operations = {item.id: item for item in problem.operations}
          sources = {item.id: item for item in problem.sources}
          reads = {item.id: item for item in problem.state_reads}
          use_counts = Counter()
          for operation in problem.operations:
              use_counts.update(operation.operands)
          use_counts.update(sink.value for sink in problem.sinks)
          for transition in problem.state_transitions:
              if transition.value is not None:
                  use_counts[transition.value] += 1
              if transition.when is not None:
                  use_counts[transition.when] += 1

          scalar = [
              item
              for item in problem.operations
              if isinstance(item.semantic, BinaryOp) and item.semantic.op == "+"
          ]
          vector = [
              item
              for item in problem.operations
              if isinstance(item.semantic, VectorBinaryOp) and item.semantic.op == "+"
          ]
          print(f"scalar_additions={len(scalar)}")
          print(f"vector_additions={len(vector)}")
          for operation in vector:
              details = []
              for operand in operation.operands:
                  if operand in operations:
                      producer = operations[operand]
                      nested = (
                          isinstance(producer.semantic, VectorBinaryOp)
                          and producer.semantic.op == "+"
                      )
                      details.append(
                          f"op={producer.id} type={type(producer.semantic).__name__} "
                          f"label={producer.label!r} uses={use_counts[operand]} nested={nested}"
                      )
                  elif operand in sources:
                      source = sources[operand]
                      details.append(
                          f"source={operand} type={type(source.semantic).__name__} "
                          f"uses={use_counts[operand]}"
                      )
                  elif operand in reads:
                      read = reads[operand]
                      details.append(
                          f"state_read={operand} register={read.register_name!r} "
                          f"uses={use_counts[operand]}"
                      )
                  else:
                      details.append(f"unknown={operand} uses={use_counts[operand]}")
              print(f"  add={operation.id} label={operation.label!r}; " + "; ".join(details))
          PY
          exit 1
      - name: Test
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
