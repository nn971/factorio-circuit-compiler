name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Test periodic wire sums with OR-Tools
        if: github.head_ref == 'agent/periodic-wire-sum'
        run: |
          uv run --with 'ortools>=9.14,<10' pytest tests/mapping/test_periodic_wire_sum.py
      - name: Diagnose Snake mapped transport accounting
        if: github.head_ref == 'agent/periodic-wire-sum'
        run: |
          echo '=== no wire sum, shared bus ==='
          uv run --with 'ortools>=9.14,<10' python -m benchmarks.snake.lower_mapping \
            --period 60 --time-limit 30 --workers 1 --without-wire-sum
          echo '=== no wire sum, private transport ==='
          uv run --with 'ortools>=9.14,<10' python -m benchmarks.snake.lower_mapping \
            --period 60 --time-limit 30 --workers 1 --without-wire-sum --max-delay-buses 0
      - name: Test
        run: uv run pytest
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
