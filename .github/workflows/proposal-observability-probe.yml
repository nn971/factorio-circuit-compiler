name: Reach-mobile proposal experiment

on:
  pull_request:
    branches:
      - main

jobs:
  validate-and-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/annealing-v2-adaptive-proposals
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Bound reach-domain scan
        run: uv run python tools/_optimize_reach_mobile_pool_experiment.py
      - name: Format touched code
        run: uv run ruff format src/factorio_circuit/synthesis/incremental_joint_layout.py
      - name: Targeted tests
        run: >-
          uv run pytest
          tests/synthesis/test_incremental_joint_regressions.py
          tests/synthesis/test_layout_observability.py
          tests/synthesis/test_layout_hash_determinism.py
      - name: Ruff lint
        run: >-
          uv run ruff check
          src/factorio_circuit/synthesis/incremental_joint_layout.py
          src/factorio_circuit/synthesis/layout_observability.py
          tests/synthesis/test_incremental_joint_regressions.py
          benchmarks/layout_optimizer_reach_pool_compare.py
      - name: Mypy
        run: uv run mypy src
      - name: Compare baseline and reach-mobile pool
        run: >-
          uv run python -m benchmarks.layout_optimizer_reach_pool_compare
          --proposals 4096 --seeds 8
