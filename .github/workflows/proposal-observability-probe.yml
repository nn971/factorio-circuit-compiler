name: Reach-mobile proposal experiment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: "${{ github.event.pull_request.head.sha == github.sha || github.event_name == 'pull_request' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/annealing-v2-adaptive-proposals
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Apply experiment
        run: uv run python tools/_apply_reach_mobile_pool_experiment.py
      - name: Format touched code
        run: >-
          uv run ruff format
          src/factorio_circuit/synthesis/incremental_joint_layout.py
          src/factorio_circuit/synthesis/layout_observability.py
          tests/synthesis/test_incremental_joint_regressions.py
      - name: Targeted tests
        run: >-
          uv run pytest
          tests/synthesis/test_incremental_joint_regressions.py
          tests/synthesis/test_layout_observability.py
          tests/synthesis/test_layout_hash_determinism.py
      - name: Ruff lint
        run: >-
          uv run ruff check
          src/factorio_circuit/synthesis/incremental_joint_layout.py
          src/factorio_circuit/synthesis/layout_observability.py
          tests/synthesis/test_incremental_joint_regressions.py
      - name: Mypy
        run: uv run mypy src
      - name: Commit experiment
        run: |
          git config user.name nn971
          git config user.email 60208623+nn971@users.noreply.github.com
          git add src/factorio_circuit/synthesis/incremental_joint_layout.py \
                  src/factorio_circuit/synthesis/layout_observability.py \
                  tests/synthesis/test_incremental_joint_regressions.py
          git commit -m 'experiment: filter reach-immobile proposal objects'
          git push origin HEAD:agent/annealing-v2-adaptive-proposals