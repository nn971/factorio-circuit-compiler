[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "factorio-circuit-compiler"
version = "0.3.0"
description = "Experimental symbolic Python compiler for optimized Factorio combinator circuits"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "factorio-circuit-compiler contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "mypy>=1.14",
]

[project.scripts]
fcc = "factorio_circuit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factorio_circuit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["factorio_circuit"]
